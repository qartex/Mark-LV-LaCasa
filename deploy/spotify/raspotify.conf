# Headless Spotify Connect receiver for lacasa-server.
# No Spotify password or access token belongs in this file.
LIBRESPOT_NAME="LaCasa Boxen"
LIBRESPOT_BACKEND=alsa
# Direct analog output. Shared JARVIS/music mixing needs separate ALSA setup.
LIBRESPOT_DEVICE="plughw:CARD=PCH,DEV=0"
LIBRESPOT_DEVICE_TYPE=speaker
LIBRESPOT_BITRATE=320
LIBRESPOT_INITIAL_VOLUME=30
LIBRESPOT_MIXER=softvol
LIBRESPOT_ENABLE_VOLUME_NORMALISATION=
LIBRESPOT_DISABLE_AUDIO_CACHE=
# Keep credential caching enabled so pairing survives a restart.
LIBRESPOT_ZEROCONF_PORT=24879
