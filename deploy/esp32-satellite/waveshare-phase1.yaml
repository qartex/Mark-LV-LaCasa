# Thin, local-only Phase-1 configuration. The reviewed vendor core is committed
# beside this file; no branch or remote package is resolved during a build.
substitutions:
  name: growraum-sprache-1-home-test
  friendly_name: "Growraum Sprache 1 Home Test"

# Keep the physically accepted home-test satellite on the FRITZ home LAN even
# if another DHCP server responds first on the shared SSID.
wifi:
  manual_ip:
    static_ip: 192.168.178.122
    gateway: 192.168.178.1
    subnet: 255.255.255.0
    dns1: 192.168.178.1

packages:
  core: !include vendor/core.yaml
